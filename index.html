
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slip Gaji Karyawan</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <header class="header">
            <h2>‹ Payslip</h2>

            <label for="periode">Periode Gaji</label>
            <input type="month" id="periode" value="2026-10">

            <div class="total-box">
                <span>Take Home Pay</span>
                <h2 id="gajiBersih">Belum dihitung</h2>
            </div>

            <button type="button" onclick="downloadSlip()">
                Download Payslip
            </button>
        </header>

        <main class="content">

            <section class="card">
                <h3>▣ Receiver Information</h3>

                <label for="nama">Nama Karyawan</label>
                <input type="text" id="nama"
                       placeholder="Masukkan nama karyawan">

                <label for="bank">Bank Name</label>
                <input type="text" id="bank"
                       placeholder="Masukkan nama bank">

                <label for="rekening">Account Number</label>
                <input type="text" id="rekening"
                       placeholder="Masukkan nomor rekening">

                <label for="pemilik">Account Holder</label>
                <input type="text" id="pemilik"
                       placeholder="Nama pemilik rekening">
            </section>

            <section class="card">
                <h3>◉ Earnings</h3>

                <label for="gajiPokok">Gaji Pokok (Rp)</label>
                <input type="number" id="gajiPokok"
                       min="0" value="1000000">

                <label for="tunjangan">Tunjangan (Rp)</label>
                <input type="number" id="tunjangan"
                       min="0" value="0">

                <label for="bonus">Bonus (Rp)</label>
                <input type="number" id="bonus"
                       min="0" value="0">
            </section>

            <section class="card">
                <h3>⊖ Deductions</h3>

                <label for="potongan">Potongan (Rp)</label>
                <input type="number" id="potongan"
                       min="0" value="0">

                <button type="button"
                        class="calculate"
                        onclick="hitungGaji()">
                    Hitung Gaji
                </button>
            </section>

            <!-- Hasil tersembunyi sebelum tombol ditekan -->
            <section class="card summary"
                     id="hasilGaji"
                     style="display: none;">

                <h3>Rincian Gaji</h3>

                <p>Gaji Pokok
                    <span id="rPokok">Rp0</span>
                </p>

                <p>Tunjangan
                    <span id="rTunjangan">Rp0</span>
                </p>

                <p>Bonus
                    <span id="rBonus">Rp0</span>
                </p>

                <p>Potongan
                    <span id="rPotongan">Rp0</span>
                </p>

                <hr>

                <h3>Gaji Bersih
                    <span id="rBersih">Rp0</span>
                </h3>
            </section>

        </main>
    </div>

    <!-- Memanggil file JavaScript -->
    <script src="script.js"></script>

</body>
</html>
